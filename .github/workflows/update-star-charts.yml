# Generated by gh-star-charts v0.6.0. Re-running "gh star-charts init" or "gh star-charts add" upgrades it.
# The cron's daily run time (UTC) may be edited; it survives regeneration.
name: update-star-charts

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-charts-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned gh-star-charts v0.6.0
        run: |
          curl -fsSL --retry 3 -o /tmp/gh-star-charts "https://github.com/utkuozdemir/gh-star-charts/releases/download/v0.6.0/gh-star-charts_v0.6.0_linux-amd64"
          echo "df8ec6a615142ba234639eba531e89e6c430d70ac9ae24f7525166082ac88b05  /tmp/gh-star-charts" | sha256sum -c -
          chmod +x /tmp/gh-star-charts
      - name: Update charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: /tmp/gh-star-charts update --instance "${{ github.repository }}"
