# Generated by gh-star-charts v0.1.0. Re-run "gh star-charts init" to upgrade.
name: update-star-charts

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-charts-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned gh-star-charts v0.1.0
        run: |
          curl -fsSL --retry 3 -o /tmp/gh-star-charts "https://github.com/utkuozdemir/gh-star-charts/releases/download/v0.1.0/gh-star-charts_v0.1.0_linux-amd64"
          echo "ca5d229615adc8c410bcdcee9db7e0325c52fd0a044e20c02b2511b68b53e744  /tmp/gh-star-charts" | sha256sum -c -
          chmod +x /tmp/gh-star-charts
      - name: Update charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: /tmp/gh-star-charts update --instance "${{ github.repository }}"
