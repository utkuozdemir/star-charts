# Generated by gh-star-charts v0.2.1. Re-run "gh star-charts init" to upgrade.
name: update-star-charts

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-charts-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned gh-star-charts v0.2.1
        run: |
          curl -fsSL --retry 3 -o /tmp/gh-star-charts "https://github.com/utkuozdemir/gh-star-charts/releases/download/v0.2.1/gh-star-charts_v0.2.1_linux-amd64"
          echo "3763372f383b493073ff67930cc24aefb2d566c14dd149cce9a329d2e97153f0  /tmp/gh-star-charts" | sha256sum -c -
          chmod +x /tmp/gh-star-charts
      - name: Update charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: /tmp/gh-star-charts update --instance "${{ github.repository }}"
