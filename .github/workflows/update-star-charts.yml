# Generated by gh-star-charts v0.2.0. Re-run "gh star-charts init" to upgrade.
name: update-star-charts

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-charts-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned gh-star-charts v0.2.0
        run: |
          curl -fsSL --retry 3 -o /tmp/gh-star-charts "https://github.com/utkuozdemir/gh-star-charts/releases/download/v0.2.0/gh-star-charts_v0.2.0_linux-amd64"
          echo "1f48992f8f2fa556d7407e8bc30ac4084e795f9560b616ecb11d7f04580efe75  /tmp/gh-star-charts" | sha256sum -c -
          chmod +x /tmp/gh-star-charts
      - name: Update charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: /tmp/gh-star-charts update --instance "${{ github.repository }}"
