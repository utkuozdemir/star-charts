# Generated by gh-star-charts v0.5.0. Re-run "gh star-charts init" to upgrade.
name: update-star-charts

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-charts-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned gh-star-charts v0.5.0
        run: |
          curl -fsSL --retry 3 -o /tmp/gh-star-charts "https://github.com/utkuozdemir/gh-star-charts/releases/download/v0.5.0/gh-star-charts_v0.5.0_linux-amd64"
          echo "c2bc900b8b0e2543c72959f6e0866c6aa7583a1ffe43769c3a9953eafa5fc451  /tmp/gh-star-charts" | sha256sum -c -
          chmod +x /tmp/gh-star-charts
      - name: Update charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: /tmp/gh-star-charts update --instance "${{ github.repository }}"
